baseURL: "https://sjtuyoimiya.github.io/"
title: "五洲湖底"

defaultContentLanguage: "zh"
hasCJKLanguage: true
enableEmoji: true
enableRobotsTXT: true
timeZone: "Asia/Shanghai"
uglyURLs: false
tableOfContents: true

minify:
  minifyOutput: true
  minifyCSS: true
  minifyJS: true

imaging: 
  anchor: "Smart"
  bgColor: "#ffffff"
  hint: "photo"
  quality: 75
  resampleFilter: "box"
  exif: 
    disableDate: false
    disableLatLong: false
    excludeFields: ""
    includeFields: ""

languages: 
  zh: 
    weight: 1
    languageCode: "zh-CN"
    languageName: "简体中文"
    title: "五洲湖底"
    timezone: "Asia/Shanghai"

permalinks: 
  diary: "/diary/:year-:month-:slug/"
  note: "/note/:year-:month-:slug/"
  tech: "/tech/:year-:month-:slug/"

markup:
  tableOfContents: 
    startLevel: 2
    endLevel: 3
  goldmark:
    renderer: 
      unsafe: true
  highlight:
      codeFences: true
      guessSyntax: false
      lineNos: true
      lineNumbersInTable: false
      style: "onedark"

params:
  description: "SJTUYoimiya's personal homepage"
  subtitle: "去把这个不完美的故事，变成我们所期望的样子！"
  favicon: "/images/favicon.ico"
  author:
    name: "SJTUYoimiya"
    email: "sjtuwzh@gmail.com"
    github: "https://github.com/SJTUYoimiya"
    bilibili: "https://space.bilibili.com/476623878"
    shiuyuan: "https://shuiyuan.sjtu.edu.cn/u/yoimiya/summary"
  githubrepo: "https://github.com/SJTUYoimiya/SJTUYoimiya.github.io"
  ga_id: "G-DYHRBH9ZVQ"
  dateFormat: "2006/01/02"

menus:
  main:
    - identifier: "index"
      name: "首页"
      url: "/"
      weight: 1
      params:
        full: "首页"
    - identifier: "tech"
      name: "技术"
      url: "/tech/"
      weight: 2
      params:
        full: "技术日志"
    - identifier: "notes"
      name: "笔记"
      url: "/notes/"
      weight: 4
      params:
        full: "学习笔记"
    - identifier: "diary"
      name: "日记"
      url: "/diary/"
      weight: 3
      params:
        full: "日记随笔"
