{{ define "main" }}
<section class="max-w-6xl mx-auto px-4 sm:px-8 lg:px-16 mt-16">
    <div class="pt-16 px-4 sm:px-8">
        <article class="mx-auto max-w-4xl">
            <header class="flex flex-col items-center">
                <h1 class="my-6 text-4xl font-bold tracking-tight text-zinc-800 sm:text-5xl dark:text-zinc-100">{{ .Title }}</h1>
            </header>
            <div class="mt-8 mx-auto prose dark:prose-invert max-w-3xl">
                {{ .Content }}
            </div>
        </article>
    </div>
</section>
{{ end }}
