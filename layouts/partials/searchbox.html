<span data-slot="control" class="relative isolate block">
    <span data-slot="icon"
        class="pointer-events-none absolute z-40 top-2.5 left-2.5 size-4 flex justify-center items-center">
        <i class="fa-solid fa-magnifying-glass text-zinc-500 dark:text-zinc-400"></i>
    </span>
    <span data-slot="control" 
        class="relative block w-full 
        before:absolute before:inset-px before:rounded-[calc(var(--radius-xl)-1px)] before:bg-white/50 before:shadow-sm dark:before:hidden
        after:pointer-events-none after:absolute after:inset-0 after:rounded-xl after:ring-transparent after:ring-inset 
        focus-within:after:ring-2 focus-within:after:ring-blue-500">
        <input name="search" placeholder="搜索" aria-label="Search"
            x-data="{ hover: false }"
            @mouseenter="hover = true" 
            @mouseleave="hover = false"
            :data-hover="hover"
            class="relative block w-full appearance-none focus:outline-hidden text-sm/6 px-8 py-[calc(--spacing(1.5)-1px)] 
                rounded-xl border border-zinc-950/10 dark:border-white/10 bg-transparent dark:bg-white/5
                data-hover:border-zinc-950/20 dark:data-hover:border-white/20" />
    </span>
</span>
